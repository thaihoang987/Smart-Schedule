# Push to `dev` -> build a multi-arch TEST image -> only then update the `test` branch.
# The `test` branch is written by this workflow only, so Home Assistant never sees a
# test update whose image is not on GHCR yet.
name: Test channel

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: test-channel
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Test version
        id: v
        run: echo "version=$(python3 .github/scripts/set_channel.py version)-test.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Switch files to the test channel
        run: python3 .github/scripts/set_channel.py apply test "${{ steps.v.outputs.version }}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: smart_scheduler
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/thaihoang987/smart-scheduler-test:${{ steps.v.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Smart Scheduler Home Assistant add-on (test channel)

      - name: Publish the test branch (image is ready)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B test
          git add -A
          git commit -m "Test ${{ steps.v.outputs.version }} (from dev ${GITHUB_SHA::7})"
          git push --force origin test
